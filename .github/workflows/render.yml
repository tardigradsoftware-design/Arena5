name: Render video

# Parallel, free rendering on GitHub's runners.
# The timeline is deterministic, so it can be cut into shards that render on
# separate 4-vCPU machines and are stitched together with a stream copy.

on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene name (src/scenes/<name>.mjs)'
        required: true
        default: 'demo'
      audio:
        description: 'Audio file inside video/ (leave default for the demo voice-over)'
        required: false
        default: 'assets/voice-tr-14s.m4a'
      duration:
        description: 'Override duration in seconds (empty = scene meta)'
        required: false
        default: ''

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: npm ci
        working-directory: video

      - name: Render shard ${{ matrix.shard }} / 6
        working-directory: video
        run: |
          node src/render.mjs \
            --scene "${{ inputs.scene }}" \
            --shard ${{ matrix.shard }}/6 \
            --out "out/part-${{ matrix.shard }}.mp4" \
            ${{ inputs.duration != '' && format('--duration {0}', inputs.duration) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: video/out/part-${{ matrix.shard }}.mp4
          retention-days: 3

  stitch:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: npm ci
        working-directory: video

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: video/out
          merge-multiple: true

      - name: Stitch shards
        working-directory: video
        env:
          AUDIO: ${{ inputs.audio }}
        run: |
          set -euo pipefail
          ls -la out
          PARTS=$(ls out/part-*.mp4 | sort -V)
          node src/concat.mjs --out out/final.mp4 --audio "$AUDIO" $PARTS

      - name: Probe result
        working-directory: video
        run: |
          SIZE=$(du -h out/final.mp4 | cut -f1)
          {
            echo "### Video hazır"
            echo ""
            echo "- dosya: \`video/out/final.mp4\` ($SIZE)"
            echo "- 6 paralel shard, ubuntu-latest (4 vCPU)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video/out/final.mp4
          retention-days: 14
